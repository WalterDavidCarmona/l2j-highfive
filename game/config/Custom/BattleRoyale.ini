# ==============================================================
# Battle Royale Event Configuration
# ==============================================================

# Enable or disable the event
BattleRoyaleEnabled = True

# Minimum and maximum players required to start
BattleRoyaleMinPlayers = 2
BattleRoyaleMaxPlayers = 20

# Minimum and maximum player level to register
BattleRoyaleMinLevel = 1
BattleRoyaleMaxLevel = 85

# Allow dualbox (same IP) registrations
BattleRoyaleAllowDualbox = False

# Duration of the registration phase in minutes (auto-closes after this time)
# At 1 minute remaining a warning is broadcast; at 0 the event starts automatically if enough players
BattleRoyaleRegistrationDuration = 5

# Duration of the event in minutes (after fight starts)
BattleRoyaleEventDuration = 30

# Duration of pre-fight countdown in seconds (players are invulnerable, cannot attack)
BattleRoyalePreFightCountdown = 60

# Seconds a player has to confirm "ready" before being disqualified (HTML prompt)
BattleRoyaleReadyTimeout = 30

# Seconds a player can be inactive (no movement/action) before being disqualified
BattleRoyaleInactivityTimeout = 180

# ------------------------------------------------------------------
# Zone Settings
# Center coordinates of the Kamaloka zone
# ------------------------------------------------------------------
BattleRoyaleCenterX = -14539
BattleRoyaleCenterY = -17892
BattleRoyaleCenterZ = -10680

# Initial zone radius (units). Players outside this take damage.
# Radius shrinks every 5 minutes after damage phase starts (minute 5+).
BattleRoyaleInitialRadius = 2000

# Radius reduction per phase (units subtracted every shrink interval)
# Secuencia: 2000 -> 1500 -> 1000 -> 500
BattleRoyaleRadiusShrinkAmount = 500

# Minimum radius (zone will not shrink below this value)
BattleRoyaleMinRadius = 500

# At which minute of the fight the zone starts dealing damage (radio inicial, sin achicar)
BattleRoyaleZoneStartMinute = 5

# Interval in minutes between zone shrinks
BattleRoyaleZoneShrinkInterval = 5

# Damage per second dealt to players outside the zone (applied every second)
BattleRoyaleZoneDamagePerSecond = 1000

# ------------------------------------------------------------------
# Spawn Coordinates
# Semicolon-separated list of x,y,z spawn points inside Kamaloka.
# Players spawn at random points from this list.
# ------------------------------------------------------------------
BattleRoyaleSpawns = -14539,-17892,-10680;-14000,-17400,-10680;-15000,-17400,-10680;-14000,-18400,-10680;-15000,-18400,-10680;-13000,-17892,-10680;-16000,-17892,-10680;-14539,-16900,-10680;-14539,-18900,-10680;-13500,-17200,-10680;-15500,-17200,-10680;-13500,-18600,-10680;-15500,-18600,-10680;-12800,-17892,-10680;-16300,-17500,-10680;-13200,-18700,-10680;-15800,-18300,-10680;-14200,-16700,-10680;-14900,-19100,-10680;-12600,-17200,-10680

# ------------------------------------------------------------------
# Box Item (item 20515 — Huge Fortuna Box)
# Se dropea en la arena cada BattleRoyaleBoxSpawnInterval minutos.
# Cantidad = jugadores vivos en ese momento.
# Los jugadores lo recogen del suelo y lo usan (doble-click) para obtener premios.
# ------------------------------------------------------------------
BattleRoyaleBoxItemId = 20515
BattleRoyaleBoxSpawnInterval = 5

# ------------------------------------------------------------------
# Box Rewards (contenido de la caja al abrirla)
# Formato: itemId,cantidad;itemId,cantidad;...
# El item 20515 no tiene drops en su XML — configurado solo aqui.
# ------------------------------------------------------------------
BattleRoyaleBoxRewards = 57,50000;6673,1;959,5

# ------------------------------------------------------------------
# Winner Rewards
# Format: itemId,count;itemId,count;...
# ------------------------------------------------------------------
BattleRoyaleWinnerRewards = 6673,5;57,500000

# Grant temporary hero status to the winner (1 week)
BattleRoyaleWinnerHero = True

# Duration of the temporary hero status in days
BattleRoyaleHeroDays = 7

# ------------------------------------------------------------------
# Return Location (Giran) — used when disqualifying players
# ------------------------------------------------------------------
BattleRoyaleReturnX = 83400
BattleRoyaleReturnY = 147943
BattleRoyaleReturnZ = -3400

# ------------------------------------------------------------------
# Title shown inside the event (empty = keep original)
# ------------------------------------------------------------------
BattleRoyaleTitle = Battle Royale

# Hide clan crest and alliance crest during the event
BattleRoyaleHideClan = True

# Skill ID for the zone pulse visual effect on players outside the zone
# Set to 0 to disable the skill visual (screen message will still appear)
BattleRoyaleZonePulseSkillId = 0

# ------------------------------------------------------------------
# Announcement messages broadcast at registration open
# ------------------------------------------------------------------
BattleRoyaleAnnouncement1 = === BATTLE ROYALE ===
BattleRoyaleAnnouncement2 = Registro abierto! Usa .registerbr para unirte al evento.
BattleRoyaleAnnouncement3 = IMPORTANTE: Buffeate ANTES de entrar — no hay buffer en la arena!
