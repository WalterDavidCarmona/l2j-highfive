# ---------------------------------------------------------------------------
# Solo Instance - Instancia individual para jugadores
# ---------------------------------------------------------------------------

# Habilitar el sistema de instancia solo.
# Default: True
SoloInstanceEnabled = True

# ID del NPC de entrada a la instancia.
# Default: 50027
SoloInstanceNpcId = 50027

# Tiempo maximo para completar la instancia (en minutos).
# Default: 30
SoloInstanceTimeLimit = 30

# Tiempo de cooldown entre intentos (en horas).
# Default: 24
SoloInstanceCooldownHours = 24

# ---------------------------------------------------------------------------
# Recompensa al completar la instancia
# ---------------------------------------------------------------------------
# ID del item de recompensa.
# Default: 10639 (Mouse Coin)
SoloInstanceRewardItemId = 10639

# Cantidad del item de recompensa (jugadores normales).
# Los jugadores Premium reciben el doble automaticamente.
# Default: 500
SoloInstanceRewardCount = 500

# ---------------------------------------------------------------------------
# Spawn inicial del jugador dentro de la instancia
# Coordenadas de entrada a Kamaloka 73 - Sel Mahum Throne
# ---------------------------------------------------------------------------
