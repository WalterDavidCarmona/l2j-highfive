# ---------------------------------------------------------------------------
# Set Enchant Visual Effect
# Aplica un Abnormal Visual Effect al jugador que lleve un set completo
# con todos sus componentes encantados al nivel minimo configurado.
# ---------------------------------------------------------------------------

# Activar / desactivar el sistema.
SetEnchantEffectEnabled = True

# Nivel minimo de encantamiento requerido en TODAS las piezas del set.
# Ejemplo: 20 = todas las piezas deben estar en +20 o superior.
SetEnchantMinLevel = 20

# Efecto visual a aplicar cuando se cumple la condicion.
# Solo se puede elegir UNO. Descomenta el que quieras usar.
#
# --- Efectos de estado / batalla ---
# DOT_BLEEDING       - Sangrado (gotas de sangre)
# DOT_POISON         - Veneno (humo verde)
# DOT_FIRE           - Fuego (llamas)
# DOT_WATER          - Agua
# DOT_WIND           - Viento
# DOT_SOIL           - Tierra
# DOT_MP             - Drenaje de MP
# DOT_FIRE_AREA      - Fuego en area
# STUN               - Aturdido (estrellas)
# SLEEP              - Dormido (ZZZ)
# SILENCE            - Silenciado
# ROOT               - Enraizado
# PARALYZE           - Paralizado
# FLESH_STONE        - Petrificado
# FREEZING           - Congelado (hielo)
# FROZEN_PILLAR      - Pilar de hielo
# BLIND              - Cegado
# SHAKE              - Temblor
# SEIZURE1           - Convulsion 1
# SEIZURE2           - Convulsion 2
#
# --- Efectos de aura / brillo ---
# VP_UP              - Aura de vitalidad (brillo dorado) [DEFAULT]
# VP_KEEP            - Mantener vitalidad
# ULTIMATE_DEFENCE   - Defensa maxima (aura azul fuerte)
# INVINCIBILITY      - Invencibilidad (aura blanca)
# REAL_TARGET        - Marca de objetivo real (rojo)
# DEATH_MARK         - Marca de muerte (oscuro)
# MAGIC_SQUARE       - Cuadrado magico
# MP_SHIELD          - Escudo de MP
# TIME_BOMB          - Bomba de tiempo
# STIGMA_OF_SILEN    - Estigma de Silen
#
# --- Efectos de movimiento ---
# FLOATING_ROOT      - Raiz flotante
# DANCE_ROOT         - Raiz de danza
# GHOST_STUN         - Aturdimiento fantasma
# TURN_FLEE          - Huir involuntariamente
# STEALTH            - Sigilo
# SPEED_DOWN         - Reduccion de velocidad
# AIR_BATTLE_SLOW    - Lentitud en combate aereo
# AIR_BATTLE_ROOT    - Raiz en combate aereo
#
# --- Efectos de transformacion visual ---
# BIG_HEAD           - Cabeza grande
# BIG_BODY           - Cuerpo grande
# CHANGE_TEXTURE     - Cambiar textura
# CHANGE_WP          - Cambiar apariencia de arma
# CHANGE_HAIR_G      - Cambiar pelo (dorado)
# CHANGE_HAIR_P      - Cambiar pelo (rosa)
# CHANGE_HAIR_B      - Cambiar pelo (azul)
# CHANGE_VES_S       - Cambiar vestimenta S
# CHANGE_VES_C       - Cambiar vestimenta C
# CHANGE_VES_D       - Cambiar vestimenta D
# NAVIT_ADVENT       - Navidad
#
# --- Efectos BR (Black Rock / especiales) ---
# BR_NONE            - Sin efecto BR
# BR_AFRO_NORMAL     - Afro normal
# BR_AFRO_PINK       - Afro rosa
# BR_AFRO_GOLD       - Afro dorado
# BR_POWER_OF_EVA    - Poder de Eva
# BR_HEADPHONE       - Audifonos
# BR_VESPER1         - Vesper 1
# BR_VESPER2         - Vesper 2
# BR_VESPER3         - Vesper 3
# BR_SOUL_AVATAR     - Avatar de alma
#
# --- Sin efecto ---
# NONE               - Sin efecto visual
#
SetAbnormalVisualEffect = VP_UP
