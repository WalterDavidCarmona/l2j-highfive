# ---------------------------------------------------------------------------
# Faction Battleground Event - Pagan Temple (Radiant vs Dire)
# ---------------------------------------------------------------------------

# Habilitar el evento.
# Default: True
EnableFactionBattleground = True

# Iniciar el evento automaticamente segun los dias configurados.
# Si es False, solo un GM puede iniciarlo con //admin -> event start.
# Default: True
AutoEventEnabled = True

# Dias en que el evento puede iniciarse.
# Valores posibles: Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday
# Se pueden configurar varios dias separados por coma.
# Default: Saturday,Sunday
EventDays = Saturday,Sunday

# Si es True, el evento alterna entre los dias configurados (un dia si, uno no).
# Si es False, corre todos los dias configurados sin excepcion.
# Default: True
AlternateDays = True

# Hora de inicio del evento (formato 24h). Se verifica cada minuto.
# El evento arrancara cuando el reloj marque esta hora en un dia habilitado.
# Default: 20
EventHour = 20

# Minuto de inicio del evento.
# Default: 0
EventMinute = 1

# ---------------------------------------------------------------------------
# Jugadores
# ---------------------------------------------------------------------------

# Minimo de jugadores totales para iniciar el evento (entre ambos bandos).
# Default: 4
MinPlayers = 2

# Maximo de jugadores totales admitidos en el evento.
# Default: 100
MaxPlayers = 100

# Nivel minimo para participar.
# Default: 76
MinLevel = 76

# Nivel maximo para participar.
# Default: 85
MaxLevel = 85

# Tiempo de registro en minutos antes de que el evento comience.
# Default: 5
RegistrationTime = 5

# Si es False, solo una cuenta por IP puede registrarse (bloquea dualbox).
# Default: False
AllowDualbox = True

# ---------------------------------------------------------------------------
# Bandos
# ---------------------------------------------------------------------------

# Nombre del bando Radiant.
RadiantName = Radiant

# Nombre del bando Dire.
DireName = Dire

# Color del nombre para Radiant (hex RRGGBB, orden BGR para L2J).
# Azul = 0000FF (se muestra azul en el cliente)
RadiantColor = FF4444

# Color del nombre para Dire.
# Rojo = FF0000 (se muestra rojo en el cliente)
DireColor = 4444FF

# ---------------------------------------------------------------------------
# NPC IDs
# ---------------------------------------------------------------------------

# NPC del evento (registro / informacion). Debe existir en npcdata.
# Default: 70020
RegistrationNpcId = 70020

# NPC usado como torre (debe ser un mob staticobject o similar con HP alto).
# Se spawnea en las coordenadas de cada tier y es destruible.
# Default: 70021
TowerNpcId = 70021

# NPC usado como bandera final (HP como Valakas).
# Default: 70022
FlagNpcId = 70022

# NPC de guardia del bando Radiant (Seal Arcangel).
# Default: 21070
RadiantGuardId = 21070

# NPC de guardia del bando Dire (Chimera of Darkness).
# Default: 22350
DireGuardId = 22350

# ---------------------------------------------------------------------------
# Guardias
# ---------------------------------------------------------------------------

# Cantidad de guardias spawneados por bando.
# Default: 10
GuardCountPerFaction = 10

# Tiempo de respawn de guardias en segundos.
# Default: 60
GuardRespawnSeconds = 60

# ---------------------------------------------------------------------------
# HP de torres y banderas
# ---------------------------------------------------------------------------

# HP maximo de cada torre.
# Default: 1000000
TowerHp = 1000000

# HP maximo de la bandera final (similar a Valakas: ~4.000.000).
# Default: 4000000
FlagHp = 4000000

# ---------------------------------------------------------------------------
# Recompensas
# ---------------------------------------------------------------------------

# ID del item de recompensa para el equipo ganador.
# Default: 6673 (Gold Bar)
WinnerRewardId = 6673

# Cantidad del item ganador por jugador.
# Default: 5
WinnerRewardCount = 5

# ID del Multisell que se abre al ganador (permite elegir equipo +20).
# El multisell debe estar configurado en data/multisell/ con este ID.
# Default: 32100
WinnerMultisellId = 32100

# ID del item de recompensa para el equipo perdedor (por participar).
# Default: 6673
LoserRewardId = 6673

# Cantidad del item perdedor por jugador.
# Default: 1
LoserRewardCount = 1

# ---------------------------------------------------------------------------
# Puertas de Pagan Temple (IDs separados por coma, 0 = sin puertas)
# Usar //admin -> door para obtener los IDs en el cliente.
# ---------------------------------------------------------------------------
DoorIds = 19160012,19160013,19160016,19160017

# ---------------------------------------------------------------------------
# Spawns (coordenadas X,Y,Z[,Heading])
# ---------------------------------------------------------------------------

# Spawn central de Giran para el NPC de registro permanente.
ManagerSpawn = 83478,149264,-3400,0

# Punto de spawn del bando Radiant al inicio del evento.
RadiantSpawn = -20389,-54336,-11112,0

# Punto de spawn del bando Dire al inicio del evento.
DireSpawn = -12682,-54193,-11112,0

# Ubicacion de la bandera de Radiant (objetivo enemigo para Dire).
# NOTA: la coordenada Y original indicaba -543359; se corrigio a -54359.
RadiantFlagLoc = -20229,-54359,-11114,0

# Ubicacion de la bandera de Dire (objetivo enemigo para Radiant).
DireFlagLoc = -12479,-54302,-11114,0

# Torres de Radiant (protegen la bandera de Radiant; Dire debe destruirlas en orden).
# Tier 1 = mas alejado de la base (primero en ser atacado).
RadiantTower1 = -20568,-45117,-10720,0
RadiantTower2 = -20608,-49150,-10912,0
RadiantTower3 = -20278,-52651,-10936,0

# Torres de Dire (protegen la bandera de Dire; Radiant debe destruirlas en orden).
DireTower1 = -12171,-45024,-10720,0
DireTower2 = -12151,-49184,-10912,0
DireTower3 = -12761,-52626,-10938,0
