# ---------------------------------------------------------------------------
# Noble Voice Command (.noble)
# ---------------------------------------------------------------------------
# Permite a los jugadores obtener status Noblesse entregando un item.
# ---------------------------------------------------------------------------

# Habilitar el comando .noble
# Default: True
NobleCmdEnabled = True

# ID del item requerido para obtener el status Noblesse.
# 6673 = Festival Adena
# Default: 6673
NobleCmdItemId = 6673

# Cantidad del item requerida.
# Default: 10
NobleCmdItemCount = 10

# Permitir usar el comando si el jugador ya tiene Noblesse (para renovar).
# Si esta en False, el jugador recibira un mensaje indicando que ya es Noble.
# Default: False
NobleCmdAllowReuse = False
