<html><body>
Augment Master:<br>
<img src="L2UI.SquareGray" width="270" height="1"><br>
Greetings, adventurer! I can bind<br1>
powerful augmentations to your<br1>
currently equipped weapon.<br>
<br>
<center>
<button value="[ PREMIUM COMBOS ]" action="bypass -h Script AugmentMaster cat_PREMIUM" width=200 height=25 back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF">
</center>
<img src="L2UI.SquareGray" width="270" height="1"><br>
<center>
<table width=260 cellpadding=2 cellspacing=2 border=0>
<tr>
<td align=center width=128>
<button value="Active Skills" action="bypass -h Script AugmentMaster cat_ACTIVE" width=124 height=22 back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF">
</td>
<td align=center width=128>
<button value="Passive Skills" action="bypass -h Script AugmentMaster cat_PASSIVE" width=124 height=22 back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF">
</td>
</tr>
<tr>
<td align=center>
<button value="Chance: Attack" action="bypass -h Script AugmentMaster cat_CHANCE_ATTACK" width=124 height=22 back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF">
</td>
<td align=center>
<button value="Chance: Critical" action="bypass -h Script AugmentMaster cat_CHANCE_CRITICAL" width=124 height=22 back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF">
</td>
</tr>
<tr>
<td align=center>
<button value="Chance: Magic" action="bypass -h Script AugmentMaster cat_CHANCE_MAGIC" width=124 height=22 back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF">
</td>
<td align=center>
<button value="Chance: Defense" action="bypass -h Script AugmentMaster cat_CHANCE_DEFENSE" width=124 height=22 back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF">
</td>
</tr>
<tr>
<td colspan=2 align=center>
<button value="Stat Bonuses" action="bypass -h Script AugmentMaster cat_STATS" width=124 height=22 back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF">
</td>
</tr>
</table>
</center>
<img src="L2UI.SquareGray" width="270" height="1"><br>
<center><a action="bypass -h Script AugmentMaster remove"><font color="FF6666">Remove Current Augment</font></a></center>
</body></html>
